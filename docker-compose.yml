# qoderbuddy2api — Docker Compose 部署
#
# 官方镜像：ghcr.io/dmego/qoderbuddy2api （支持 linux/amd64 与 linux/arm64）
# 每次打 v* 发布 tag 或推送 main 时由 GitHub Actions 自动构建推送。
#
# 部署方式（推荐）：
#   1. cp .env.example .env && chmod 600 .env
#      填入 QB2API_PROXY_API_KEY / QB2API_ADMIN_KEY / QB2API_CREDENTIAL_KEY
#   2. docker compose up -d
#
# 状态外挂（bind mount，镜像不携带任何运行数据）：
#   ./data   -> /data     SQLite、worker.internal、备份
#   ./logs   -> /logs     请求 / 服务日志
#   ./config -> /config   模型目录 models.json（可在管理台"从上游同步"更新）
#
# 安全边界：
#   - 仅发布 9999（管理台 /admin + 统一 /v1 入口）；
#     Proxy Worker 10001 留在容器内 loopback，不对宿主机发布。
#   - Worker 内部 token 首次启动自动生成到 ./data/worker.internal（0600）。
#   - 容器内上游请求直连，不继承宿主机 shell 的代理环境。

name: qb2api

services:
  qb2api:
    image: ghcr.io/dmego/qoderbuddy2api:latest
    container_name: qb2api-control
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QB2API_MODE: control
      # .env 里的相对路径在这里必须改成容器内挂载点
      QB2API_CONTROL_HOST: 0.0.0.0
      QB2API_CONTROL_PORT: "9999"
      QB2API_WORKER_HOST: 127.0.0.1
      QB2API_WORKER_PORT: "10001"
      QB2API_DATA_DIR: /data
      QB2API_LOG_DIR: /logs
      QB2API_MODEL_CONFIG: /config/models.json
    ports:
      - "9999:9999"
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./config:/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; (u.urlopen('http://127.0.0.1:9999/health', timeout=3).status == 200) or exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
