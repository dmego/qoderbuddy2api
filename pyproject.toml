[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qoderbuddy2api"
version = "1.0.0"
description = "OpenAI-compatible proxy for CodeBuddy & Qoder CN LLM APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "qoderbuddy2api contributors"},
]
keywords = [
    "openai",
    "api",
    "proxy",
    "llm",
    "codebuddy",
    "qoder",
    "openai-compatible",
    "chatgpt",
    "chat-completion",
    "streaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "httpx[socks]>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
qb2api = "qb2api.cli:main"

[project.urls]
Homepage = "https://github.com/dmego/qoderbuddy2api"
Repository = "https://github.com/dmego/qoderbuddy2api"
Issues = "https://github.com/dmego/qoderbuddy2api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qb2api"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
