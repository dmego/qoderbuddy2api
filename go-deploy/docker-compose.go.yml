# qoderbuddy2api — Go rewrite, runs ALONGSIDE the Python deployment.
#
# Deliberately separate from docker-compose.yml so both stacks can run at once:
#   * the service listens on 9999, same as the Python build it replaces
#
# Port history: 9998 is bound on this host by an unrelated service
# (homework/rca-resarch-net/tools/net_sync.py, listening on 0.0.0.0:9998), which
# shadows a container published on the same port because a specific-address bind
# wins over a wildcard one. A side-by-side run therefore used 9997; once the
# Python service stopped, the Go build took over 9999.
#   * its own data copy, so the Go build's schema additions and history
#     compaction cannot affect the running Python instance
#   * same credential vault key, so the copied database's encrypted credentials
#     decrypt without a re-login
#
# Migrate a snapshot of the live database in with:
#   sqlite3 data/qb2api.sqlite3 ".backup 'go-data/qb2api.sqlite3'"
name: qb2api-go

services:
  qb2api-go:
    build:
      # Context is the repository root: the Dockerfile needs cmd/, internal/ and
      # the prebuilt admin console in web/dist.
      context: /Users/dmego/vibeCoding/qoderbuddy2api
      dockerfile: /Users/dmego/vibeCoding/qoderbuddy2api/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: qb2api-go:local
    container_name: qb2api-go
    restart: unless-stopped
    env_file:
      - .env.go
    environment:
      QB2API_MODE: control
      # The Go build serves the proxy and the console from one process, so every
      # listener is reachable from the host on the single mapped port.
      QB2API_HOST: 0.0.0.0
      QB2API_PORT: "9999"
      QB2API_CONTROL_HOST: 0.0.0.0
      QB2API_CONTROL_PORT: "9999"
      # Container-internal paths (the .env uses relative host paths).
      QB2API_DATA_DIR: /data
      QB2API_LOG_DIR: /logs
      QB2API_MODEL_CONFIG: /config/models.json
      QB2API_WEB_DIR: /app/web/dist
    ports:
      - "9999:9999"
    volumes:
      - ./go-data:/data
      - ./go-logs:/logs
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "/app/qb2api", "-print-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
