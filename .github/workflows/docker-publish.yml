name: Build and publish Docker images

# 发版即自动出镜像：
#   - push tag v*        → 构建并推送 semver + latest
#   - push main          → 构建并推送 edge（滚动预览）
#   - 工作流手动触发      → 默认 edge
# 推送目标：
#   GHCR（ghcr.io/dmego/qoderbuddy2api）—— 用 GH_TOKEN（仓库 secret）登录；
#   Docker Hub（DOCKER_USERNAME/DOCKER_TOKEN secrets 配置后启用）。

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: qoderbuddy2api
  # secrets 不能在 step.if 中引用，先提升到 job env 再判断
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKER_TOKEN }}

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        # 版本号唯一来源：控制台 /version 返回的 server.Version。
        run: |
          VERSION=$(sed -n 's/.*Version = "\(.*\)"/\1/p' internal/server/server.go)
          if [ -z "$VERSION" ]; then
            echo "::error::cannot read server.Version from internal/server/server.go"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # tag 与代码内版本一致性校验（手工发版防错位）
      - name: Verify tag matches server version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${TAG#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag $TAG does not match server version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR 登录：优先 GH_TOKEN，回退 GITHUB_TOKEN（总是可用）
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        id: dockerhub-login
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker meta (GHCR)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Docker meta (Docker Hub)
        id: meta-dockerhub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (Docker Hub)
        uses: docker/build-push-action@v6
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          context: .
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
